apiVersion: v1
kind: ConfigMap
metadata:
  name: amnezia-bot-config
  namespace: amnezia
data:
  config.yaml: |
    admin_ids: [111111111]
    default_limit: 3
    routes:
      url: https://raw.githubusercontent.com/w1zardz/amnezia-split-route-sync/master/dist/wg-allowed-ips.txt
      refresh_interval: 1h
    monitor:
      check_interval: 30s
      down_threshold: 2m
    servers:
      - id: spb-1
        display_name: SPB VPN-1
        enabled: true
        host: 203.0.113.10
        ssh_port: 22
        ssh_user: amnezia-bot
        interface: wg0
        endpoint: 203.0.113.10:51820
        server_public_key: "BASE64_PUBKEY_OF_SERVER"
        client_cidr: 10.8.1.0/24
        dns: []
        awg:
          jc: 4
          jmin: 40
          jmax: 70
          s1: 68
          s2: 149
          h1: 1234567
          h2: 2345678
          h3: 3456789
          h4: 4567890

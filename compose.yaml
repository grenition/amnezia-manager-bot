services:
  postgres:
    image: postgres:16-alpine
    container_name: amnezia-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amnezia_dev
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

  fake-vpn:
    build:
      context: .
      dockerfile: deploy/docker/fake-vpn/Dockerfile
    container_name: amnezia-fake-vpn
    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:8081:80"
    volumes:
      - ./deploy/docker/fake-vpn/keys:/keys:ro
      - fake_vpn_conf:/etc/amnezia

volumes:
  pgdata:
  fake_vpn_conf:

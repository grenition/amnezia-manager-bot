services:
  postgres:
    image: postgres:16-alpine
    container_name: amnezia-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amnezia_dev
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Локальный стенд AmneziaWG-сервера для ручного тестирования бота.
  # Настоящие sudo-скрипты монтируются из репозитория self-infra.
  fake-vpn:
    build: deploy/docker/fake-vpn
    container_name: amnezia-fake-vpn
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - ${SELF_INFRA_DIR:-../../DocsPlatform/self-infra}/servers/amnezia-vpn:/vpn-scripts:ro
      - ./deploy/docker/fake-vpn/keys:/keys:ro
      - fake_vpn_conf:/etc/amnezia

volumes:
  pgdata:
  fake_vpn_conf:
